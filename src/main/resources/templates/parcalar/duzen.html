<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    Ortak sayfa parçaları.

    Bu dosya tek başına açılmaz; diğer şablonlar buradaki parçaları
    th:replace ile kendi içine çeker. Amaç aynı yirmi satırı dokuz sayfaya
    kopyalamamak: üst çubuğun rengi değişecekse tek yerden değişsin.

    Parçaların yeri önemli: kafa parçası <head> içinde, gövdeye ait üç parça
    <body> içinde duruyor. Hepsi <head> içindeyken üst çubuk sessizce boş
    render ediliyordu — HTML ayrıştırıcısı <head> içinde gördüğü <header>
    etiketini gövde içeriği sayıp atıyor, ama hata da vermiyor.

    Kullanımı:
        <head>
            <th:block th:replace="~{parcalar/duzen :: kafa('Analiz Raporu')}"></th:block>
        </head>
        <body>
            <th:block th:replace="~{parcalar/duzen :: ustcubuk}"></th:block>
            <th:block th:replace="~{parcalar/duzen :: adimlar(5)}"></th:block>
            ...
            <th:block th:replace="~{parcalar/duzen :: altbilgi}"></th:block>
-->
<head>

<!-- ==================================================================== -->
<!-- kafa: meta etiketleri, sayfa başlığı ve stiller                       -->
<!-- ==================================================================== -->
<th:block th:fragment="kafa(baslik)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${baslik} + ' · Veri Kalitesi'">Veri Kalitesi</title>

    <!--
        Bootstrap 5.3.3 — jsDelivr üzerinden.
        integrity değeri dosyanın SHA-384 özeti: tarayıcı indirdiği dosyanın
        özetini bununla karşılaştırır, tutmazsa dosyayı hiç çalıştırmaz.
        Aradaki bir sunucu içeriği değiştirse bile sayfaya sızamaz.
    -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <!-- Kendi temamız Bootstrap'ten SONRA gelir; sırası önemli, ezme buna dayanıyor. -->
    <link rel="stylesheet" th:href="@{/css/tema.css}"/>
</th:block>

</head>
<body>

<!-- ==================================================================== -->
<!-- ustcubuk: marka + hangi veritabanına bağlıyız + hangi tablodayız      -->
<!-- ==================================================================== -->
<th:block th:fragment="ustcubuk">
    <header class="tc-ustcubuk">
        <div class="container-xl d-flex align-items-center justify-content-between gap-3 flex-wrap">

            <a class="tc-marka" th:href="@{/tablolar}">
                <span class="tc-marka-isaret">VK</span>
                <span>
                    Veri Kalitesi
                    <span class="tc-etiket d-block" style="letter-spacing:.1em;">DOĞRULAMA ARACI</span>
                </span>
            </a>

            <!--
                Bu iki rozet oturumdan okunuyor (session.tabloAdi,
                session.baglantiBilgisi). Denetleyicilerde hiçbir değişiklik
                gerekmedi; Thymeleaf oturum niteliklerine doğrudan erişebiliyor.
            -->
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="tc-durum" th:if="${session != null and session.baglantiBilgisi != null}">
                    <span class="tc-durum-nokta"></span>
                    <span th:text="${session.baglantiBilgisi.veriTabani}">veritabanı</span>
                </span>
                <span class="tc-durum" th:if="${session != null and session.tabloAdi != null}">
                    <span class="tc-etiket">TABLO</span>
                    <strong th:text="${session.tabloAdi}">tablo</strong>
                </span>
            </div>
        </div>
    </header>
</th:block>

<!-- ==================================================================== -->
<!-- adimlar: dokuz adımlı akışta neredeyiz                                -->
<!--                                                                      -->
<!-- Sayı 1-9 arası verilir. Küçükler "geçildi", eşit olan "aktif",        -->
<!-- büyükler soluk kalır. Böylece ekranı ilk gören biri bile aracın       -->
<!-- kaç aşamalı olduğunu ve nerede durduğunu tek bakışta görüyor.         -->
<!-- ==================================================================== -->
<th:block th:fragment="adimlar(aktif)">
    <nav class="tc-adimlar" aria-label="İlerleme">
        <div class="container-xl d-flex align-items-center gap-1 flex-wrap">
            <th:block th:with="adlar=${ {'Bağlantı','Tablo','Eşleştirme','Kelime','Rapor','Kolon','Kural','Önizleme','Sonuç'} }">
                <th:block th:each="ad, d : ${adlar}">
                    <span th:class="'tc-adim' + (${d.count} == ${aktif} ? ' aktif'
                                              : (${d.count} &lt; ${aktif} ? ' gecildi' : ''))"
                          th:attrappend="aria-current=${d.count == aktif} ? 'step' : null">
                        <span class="tc-adim-no" th:text="${d.count}">1</span>
                        <span th:text="${ad}">Adım</span>
                    </span>
                    <span class="tc-adim-ayrac" th:unless="${d.last}">›</span>
                </th:block>
            </th:block>
        </div>
    </nav>
</th:block>

<!-- ==================================================================== -->
<!-- altbilgi                                                             -->
<!-- ==================================================================== -->
<th:block th:fragment="altbilgi">
    <footer class="tc-altbilgi">
        <div class="container-xl d-flex justify-content-between gap-3 flex-wrap">
            <span>Veri Kalitesi Doğrulama Aracı · Market Calculus</span>
            <span>Kalite boyutları DAMA çerçevesine göre adlandırıldı.</span>
        </div>
    </footer>
    <!--
        Bootstrap'in JavaScript paketi BİLEREK eklenmedi.

        O paket yalnızca açılır menü, modal, sekme, ipucu gibi hareketli
        bileşenler için gerekli; bu araçta bunların hiçbiri yok. Sayfalar
        düz form ve tablo, hepsi sunucuda üretiliyor. Eklenseydi her sayfa
        boşuna 80 KB daha indirecek ve hiçbir işe yaramayacaktı.

        Sonuç: arayüzde tek satır JavaScript çalışmıyor.
    -->
</th:block>

</body>
</html>

spring.profiles.active=dev

# Firma adlarindaki kalip kelimeleri (hukuki unvan, faaliyet tanimi) bulmak icin
# frekans listesinde aranan en kucuk dusus orani. Ornek: bir kelime bir sonrakinden
# 2 kat daha sik geciyorsa orada bir kirilma var kabul edilir ve o noktaya kadarki
# kelimeler karsilastirma disi birakilir. Kirilma bu oranin altindaysa hicbir kelime
# haric tutulmaz -- o kolonda kalip kelime yok demektir.
veri.kalipKelimeEnAzDususOrani=2.0

# Kopya firma tespitinde iki adin ayni sayilmasi icin gereken en dusuk benzerlik puani (0-1).
# Olculdu (tablo_irak_tasjeelmot, 5000 satir): 0.8 -> hicbir bulgu, 0.7 -> 142 cift,
# 0.6 -> 999 cift ve yanlis eslesmeler basliyor. 0.7 incelenebilir bir sayi veriyor.
veri.benzerlikEsigi=0.7

# Kimlik numarasi kolonunda bir kalibin "baskin" sayilmasi icin gereken en dusuk kapsama orani.
# Bunun altinda kalan kolonlarda hicbir satir isaretlenmez: UUID gibi rastgele uretilmis
# kimliklerde her deger farkli sekle sahiptir ve "kaliba uymayan satir" diye bir sey yoktur.
veri.kimlikNoBaskinKalipOrani=0.8
veri.yerTutucular=n/a,na,n.a.,none,null,nil,unknown,no email,no data,not available,yok,yoktur,bilinmiyor,belirtilmemis,belirtilmemiş,belirsiz,tanimsiz,tanımsız,bos,boş
